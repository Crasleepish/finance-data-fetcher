[project]
name = "finance-data-fetcher"
version = "0.1.0"
description = "FastAPI microservice for fetch-clean-persist workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "SQLAlchemy>=2.0",
  "PyYAML>=6.0",
  "psycopg2-binary>=2.9",
  "requests>=2.32",
  "tushare>=1.2.10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.9",
  "pytest>=8.0",
  "ruff>=0.4",
  "testcontainers>=4.7",
  "types-requests>=2.32.0.20240914",
  "types-PyYAML>=6.0.12.20240311",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
mypy_path = ["src"]
files = ["src"]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
warn_unreachable = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
